<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Clinical Trial App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #1D9E75;
      --bs-secondary: #378ADD;
      --bs-info: #185FA5;
      --bs-light: #E1F5EE;
      --bs-body-bg: #F7F9F8;
    }
    body {
      background-color: var(--bs-body-bg);
      font-family: Arial, sans-serif;
    }
    h1, h2 {
      color: var(--bs-info);
    }
    .btn-primary, .btn-custom {
      background-color: var(--bs-primary);
      color: #ffffff;
    }
    .btn-primary:hover, .btn-custom:hover {
      background-color: #157a5a;
    }
    .navbar {
      background-color: var(--bs-info);
    }
    .navbar-brand {
      color: #ffffff !important;
    }
    .hero {
      background-color: var(--bs-light);
      padding: 60px 20px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .hero img {
      max-width: 300px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="container py-4">

  <!-- Navigation Bar -->
  <nav class="navbar mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Clinical Trial App</span>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <img src="homePage.jpg" alt="Clinical Trial Image">
    <h1>Welcome to Clinical Trial Management</h1>
    <p class="lead">Manage visits, capture CRF data, and track progress with ease.</p>
    <div class="mt-4">
      <a href="login.html" class="btn btn-primary me-3">Login</a>
      <a href="register.html" class="btn btn-secondary">Register</a>
    </div>
  </div>

</body>
</html>
