<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visit Scheduling & CRF Capture</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #1D9E75;
      --bs-secondary: #378ADD;
      --bs-info: #185FA5;
      --bs-light: #E1F5EE;
      --bs-body-bg: #F7F9F8;
    }
    body {
      background-color: var(--bs-body-bg);
      font-family: Arial, sans-serif;
    }
    h1, h2 {
      color: var(--bs-info);; 
    }
    .btn-primary, .btn-custom {
      background-color: var(--bs-primary);
      color: #ffffff;
    }
    .btn-primary:hover, .btn-custom:hover {
      background-color: #157a5a;
    }
    .card {
      border: 1px solid var(--bs-primary);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .navbar {
      background-color: var(--bs-info);
    }
    .navbar-brand {
      color: #ffffff !important;
    }
    .table thead {
      background-color: var(--bs-secondary);
      color: #ffffff;
    }
  </style>
</head>
<body class="container py-4">

    <!-- Navigation Bar -->
  <nav class="navbar mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Clinical Trial Visit Module</span>
    </div>
  </nav>


  <h1 class="text-center mb-4">Visit Scheduling & Case Report Form Capture</h1>

  <!-- Schedule Visit Form-->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Schedule Visit</h2>
      <form id="scheduleVisitForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="subjectId" class="form-label">Subject ID</label>
            <input type="text" class="form-control" id="subjectId" name="subjectId" required>
          </div>
          <div class="col-md-6">
            <label for="visitName" class="form-label">Visit Name</label>
            <input type="text" class="form-control" id="visitName" name="visitName" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="visitDate" class="form-label">Visit Date</label>
          <input type="date" class="form-control" id="visitDate" name="visitDate" required>
        </div>
        <button type="submit" class="btn btn-custom">Schedule Visit</button>
      </form>
    </div>
  </div>

  <!-- Record CRF Data -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Record CRF Data</h2>
      <form id="recordCrfForm">
        <div class="mb-3">
          <label for="visitId" class="form-label">Visit ID</label>
          <input type="text" class="form-control" id="visitId" name="visitId" required>
        </div>
        <div class="mb-3">
          <label for="crfStatus" class="form-label">CRF Status</label>
          <select class="form-select" id="crfStatus" name="crfStatus">
            <option value="PENDING">PENDING</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="LOCKED">LOCKED</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="queryCount" class="form-label">Query Count</label>
          <input type="number" class="form-control" id="queryCount" name="queryCount" min="0">
        </div>
        <button type="submit" class="btn btn-custom">Record CRF Data</button>
      </form>
    </div>
  </div>

  <!-- Lock CRF -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Lock CRF</h2>
      <form id="lockCrfForm">
        <div class="mb-3">
          <label for="lockVisitId" class="form-label">Visit ID</label>
          <input type="text" class="form-control" id="lockVisitId" name="lockVisitId" required>
        </div>
        <button type="submit" class="btn btn-custom">Lock CRF</button>
      </form>
    </div>
  </div>

  <!-- Visit History -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Visit History</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Visit ID</th>
            <th>Subject ID</th>
            <th>Visit Name</th>
            <th>Visit Date</th>
            <th>CRF Status</th>
            <th>Query Count</th>
          </tr>
        </thead>
        <tbody id="visitHistoryTable">
          <!-- Dynamic rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Schedule Visit
    document.getElementById("scheduleVisitForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
        subjectId: document.getElementById("subjectId").value,
        visitName: document.getElementById("visitName").value,
        visitDate: document.getElementById("visitDate").value
    };
    await fetch("/visits/schedule", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
    });

    // Record CRF Data
    document.getElementById("recordCrfForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
        visitId: document.getElementById("visitId").value,
        crfStatus: document.getElementById("crfStatus").value,
        queryCount: document.getElementById("queryCount").value
    };
    await fetch("/visits/crf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
    });

    // Lock CRF
    document.getElementById("lockCrfForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = { visitId: document.getElementById("lockVisitId").value };
    await fetch("/visits/lock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
    });

    // Load Visit History
    async function loadHistory(subjectId) {
    const response = await fetch(`/visits/history/${subjectId}`);
    const visits = await response.json();
    const tableBody = document.getElementById("visitHistoryTable");
    tableBody.innerHTML = "";
    visits.forEach(v => {
        tableBody.innerHTML += `
        <tr>
            <td>${v.visitId}</td>
            <td>${v.subjectId}</td>
            <td>${v.visitName}</td>
            <td>${v.visitDate}</td>
            <td>${v.crfStatus}</td>
            <td>${v.queryCount}</td>
        </tr>`;
    });
    }

  </script>
</body>
</html>
