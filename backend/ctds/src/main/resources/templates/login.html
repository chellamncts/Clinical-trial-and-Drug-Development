<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Clinical App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

<div class="wrapper shadow-lg">
    <div class="row align-items-center">

        <div class="col-md-7 left-section text-center">
            <img th:src="@{/assets/image.png}" src="/assets/image.png" alt="Medical Illustration">
        </div>

        <div class="col-md-5">
            <div class="login-card text-center">

                <img th:src="@{/assets/logo.png}" src="/assets/logo.png" class="logo mb-2" alt="CTDS Logo">
                <p class="small text-muted">Lifeline</p>

                <h4>Welcome Back</h4>
                <p class="text-muted small">Please enter your credentials to continue</p>

                <div th:if="${logoutMessage}" class="alert alert-success text-start" th:text="${logoutMessage}"></div>
                <div th:if="${error}" class="alert alert-danger text-start" th:text="${error}"></div>

                <form th:action="@{/login}" method="post" class="mt-4">

                    <div class="mb-3">
                        <label for="username" class="visually-hidden">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter User ID" th:value="${username}" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="visually-hidden">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required>
                    </div>

                    <button type="submit" class="btn btn-login w-100">LOGIN</button><br>
                    <a th:href="@{/home}" href="/home" class="btn btn-outline-secondary w-100 mt-2">BACK</a>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
