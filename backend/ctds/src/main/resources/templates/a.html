<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enrollment Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e8f5e9;
            font-family: Arial;
        }

        .card {
            margin: 50px auto;
            width: 50%;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-header {
            background-color: #2e7d32;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        table {
            margin-top: 15px;
        }

        th {
            background-color: #2e7d32;
            color: white;
        }

        .btn-back {
            background-color: #2e7d32;
            color: white;
        }

        .btn-back:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
         Enrollment Successful
    </div>
    <div class="card-body">
        <table class="table table-bordered text-center">
            <thead>
            <tr>
                <th>Field</th>
                <th>Value</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Subject ID</td>
                <td th:text="${data.subjectId}"></td>
            </tr>
            <tr>
                <td>Protocol ID</td>
                <td th:text="${data.protocolId}"></td>
            </tr>
            <tr>
                <td>Status</td>
                <td th:text="${data.subjectStatus}"></td>
            </tr>
            </tbody>
        </table>
        <div class="text-center mt-3">
            <a href="/enrollment" class="btn btn-back">← Back to Form</a>
        </div>

    </div>

</div>

</body>
</html>
