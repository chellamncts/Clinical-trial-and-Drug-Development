<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRC Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" th:href="@{/css/crcDashboard.css}">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a class="active" th:href="@{/crcDashboard}">Dashboard</a></li>
        <li><a th:href="@{/enrollment}">Subject Enrollment</a></li>
        <li><a th:href="@{/visits/visitScheduling}">Visit Scheduling</a></li>
        <li><a th:href="@{/visits/crfPage}">CRFs</a></li>
        <li><a th:href="@{/queriesPage}">Queries</a></li>
        <li><a th:href="@{/reports}">Reports</a></li>
        <li><a th:href="@{/logout}">Logout</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Summary Boxes Row -->
    <div class="row mb-4">
        <div class="col-md-2"><div class="summary-box"><h6>Scheduled Visits</h6><h3 th:text="${crcDashboard.scheduledVisits}">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Pending CRFs</h6><h3 th:text="${crcDashboard.pendingCrfs}">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Completed CRFs</h6><h3 th:text="${crcDashboard.completedCrfs}">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Locked CRFs</h6><h3 th:text="${crcDashboard.lockedCrfs}">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Open Queries</h6><h3 th:text="${openQueries}">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Enrolled Subjects</h6><h3 th:text="${enrolledSubjects}">0</h3></div></div>
    </div>

    <!-- Charts -->
    <div class="row mb-4">
        <div class="col-md-4"><div class="card p-3"><h6>CRF Status Distribution</h6><canvas id="crfStatusChart"></canvas></div></div>
        <div class="col-md-4"><div class="card p-3"><h6>Visits Timeline</h6><canvas id="visitsChart"></canvas></div></div>
        <div class="col-md-4"><div class="card p-3"><h6>Subject Enrollment Trends</h6><canvas id="subjectChart"></canvas></div></div>
    </div>
</div>

<!-- Chart.js Scripts -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // CRF Status Pie Chart
    new Chart(document.getElementById('crfStatusChart'), {
      type: 'pie',
      data: {
        labels: ['Pending','Completed','Locked'],
        datasets:[{
          data: [ [[${crcDashboard.pendingCrfs}]], [[${crcDashboard.completedCrfs}]], [[${crcDashboard.lockedCrfs}]] ],
          backgroundColor:['#ffcc00','#1D9E75','#185FA5']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // Visits Timeline Line Chart
    new Chart(document.getElementById('visitsChart'), {
      type: 'line',
      data: {
        labels: [[${crcDashboard.visitsTimelineLabels}]],
        datasets:[{
          label:'Visits',
          data: [[${crcDashboard.visitsTimelineData}]],
          borderColor:'#378ADD',
          fill:false,
          tension:0.3
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // Subject Enrollment Bar Chart
    new Chart(document.getElementById('subjectChart'), {
      type: 'bar',
      data: {
        labels:['Screened','Enrolled','Withdrawn'],
        datasets:[{
          label:'Subjects',
          data: [[${crcDashboard.subjectEnrollmentData}]],
          backgroundColor:['#ffcc00','#1D9E75','#d9534f']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
    /*]]>*/
</script>

</body>
</html>
