<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Protocol Creation - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/adminDashboard.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>Admin Dashboard</h3>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/userManagement}">User Management</a>
    <a class="active" th:href="@{/createProtocol}">Protocol Creation</a>
    <a th:href="@{/sites}">Site Activation</a>
    <a href="reports.html">Reports</a>
    <a th:href="@{/logout}">Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">
    <h4>Protocol Creation</h4>

    <!-- Add Protocol Button -->
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProtocolModal">+ Add Protocol</button>
    </div>

    <!-- Search Field -->
    <div class="card p-3 mb-4">
        <div class="row g-2 align-items-center">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search protocols by title, area, or phase...">
            </div>
            <div class="col-md-3">
                <select id="phaseFilter" class="form-select">
                    <option value="">Filter by Phase</option>
                    <option>Phase I</option>
                    <option>Phase II</option>
                    <option>Phase III</option>
                    <option>Phase IV</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">Filter by Status</option>
                    <option>Draft</option>
                    <option>Active</option>
                    <option>Completed</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Protocols Table -->
    <div class="card p-3 mb-4">
        <h6>Registered Protocols</h6>
        <table class="table table-striped" id="protocolTable">
            <thead>
            <tr><th>Protocol ID</th><th>Title</th><th>Therapeutic Area</th><th>Phase</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="p:${protocols}"><td th:text="${p.protocol_id}">P101</td><td th:text="${p.protocol_title}"><td th:text="${p.therapeuticArea}">Cancer Drug Trial</td><td th:text="${p.phase}">Oncology</td><td th:text="${p.protocolStatus}">Phase II</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Protocol Modal -->
<div class="modal fade" id="addProtocolModal" tabindex="-1" aria-labelledby="addProtocolModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="addProtocolModalLabel">Add New Protocol</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form th:action="@{/postProtocol}" th:object="${protocolObject}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Protocol Title</label>
                        <input type="text" th:field="*{protocol_title}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Therapeutic Area</label>
                        <input type="text" th:field="*{therapeuticArea}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phase</label>
                        <select th:field="*{phase}" class="form-select" required>
                            <option th:each="s:${phases}" th:value="${s}" th:text="${s}" ></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{protocolStatus}" required>
                            <option th:each="ps:${pro}" th:value="${ps}" th:text="${ps}" ></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" th:field="*{startDate}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Protocol</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Search Script -->
<script>
    function filterTable() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const phase = document.getElementById("phaseFilter").value;
      const status = document.getElementById("statusFilter").value;
      const rows = document.querySelectorAll("#protocolTable tbody tr");

      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        const phaseMatch = !phase || row.cells[3].innerText === phase;
        const statusMatch = !status || row.cells[4].innerText === status;
        row.style.display = (text.includes(search) && phaseMatch && statusMatch) ? "" : "none";
      });
    }

    document.getElementById("searchInput").addEventListener("keyup", filterTable);
    document.getElementById("phaseFilter").addEventListener("change", filterTable);
    document.getElementById("statusFilter").addEventListener("change", filterTable);
</script>

</body>
</html>
