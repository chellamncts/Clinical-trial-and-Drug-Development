<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Enrollment - Clinical Trial</title>
    <link rel="stylesheet" th:href="@{/css/enrollment.css}">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a th:href="@{/crcDashboard}">Dashboard</a></li>
        <li><a class="active" th:href="@{/enrollment}">Subject Enrollment</a></li>
        <li><a th:href="@{/visits/visitScheduling}">Visit Scheduling</a></li>
        <li><a th:href="@{/visits/crfPage}">CRFs</a></li>
        <li><a th:href="@{/queriesPage}">Queries</a></li>
        <li><a th:href="@{/reports}">Reports</a></li>
        <li><a th:href="@{/logout}">Logout</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <nav class="navbar">
        <div class="brand"><span class="dot"></span> Clinical Trial & Drug Development Tracking</div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title">Subject Enrollment & Consent Management</div>
            <div class="card-body">
                <form th:action="@{/enroll}" th:object="${subject}" method="post">
                    <div class="grid">
                        <div class="field">
                            <label for="subjectId">Subject ID <span class="required">*</span></label>
                            <input id="subjectId" type="text" th:field="*{subjectId}" placeholder="Enter Subject ID" required>
                        </div>
                        <div class="field">
                            <label for="protocolId">Protocol ID <span class="required">*</span></label>
                            <input id="protocolId" type="text" th:field="*{protocolId}" placeholder="Enter Protocol ID" required>
                        </div>
                        <div class="field">
                            <label for="siteId">Site ID <span class="required">*</span></label>
                            <input id="siteId" type="text" th:field="*{siteId}" placeholder="Enter Site ID" required>
                        </div>
                        <div class="field">
                            <label for="enrollmentDate">Enrollment Date <span class="required">*</span></label>
                            <input id="enrollmentDate" type="date" th:field="*{enrollmentDate}" required>
                        </div>
                        <div class="field">
                            <label for="studyArm">Study Arm <span class="required">*</span></label>
                            <select id="studyArm" th:field="*{studyArm}" required>
                                <option value="">Select Arm</option>
                                <option value="Control">Control</option>
                                <option value="Treatment A">Treatment A</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="subjectStatus">Subject Status <span class="required">*</span></label>
                            <select id="subjectStatus" th:field="*{subjectStatus}" required>
                                <option value="">Select Subject Status</option>
                                <option value="SCREENED">SCREENED</option>
                                <option value="ENROLLED">ENROLLED</option>
                                <option value="COMPLETED">COMPLETED</option>
                                <option value="WITHDRAWN">WITHDRAWN</option>
                            </select>
                        </div>
                    </div>

                    <div class="field checkbox-row">
                        <input id="consentCheck" type="checkbox" th:field="*{consentProvided}">
                        <label for="consentCheck">Informed Consent Provided <span class="required">*</span></label>
                    </div>

                    <div class="actions">
                        <button class="btn" type="submit">Submit</button>
                        <a th:href="@{/enrollmentStatus}" class="btn btn-outline">View Status</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">&copy; 2026 Clinical Trial & Drug Development Tracking System</footer>
</div>

<script th:src="@{/js/enrollment.js}"></script>
</body>
</html>
