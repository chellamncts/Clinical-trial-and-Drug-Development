<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/enrollment.css">
</head>

<body>

<div class="container">

    <h2>Subject Enrollment & Consent Management</h2>
    <form th:action="@{/enroll}" th:object="${subject}" method="post">
        <div class="form-group">
            <label class="form-label">Subject ID <span style="color:red">*</span></label>
            <input type="text" th:field="*{subjectId}" class="form-control" placeholder="Enter Subject ID" required>
        </div>
        <div class="form-group">
            <label class="form-label">Protocol ID <span style="color:red">*</span></label>
            <input type="text" th:field="*{protocolId}" class="form-control" placeholder="Enter Protocol ID" required>
        </div>
        <div class="form-group">
            <label class="form-label">Site ID <span style="color:red">*</span></label>
            <input type="text" th:field="*{siteId}" class="form-control" placeholder="Enter Site ID" required>
        </div>
        <div class="form-group">
            <label class="form-label">Enrollment Date <span style="color:red">*</span></label>
            <input type="date" th:field="*{enrollmentDate}" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">Study Arm <span style="color:red">*</span></label>
            <select th:field="*{studyArm}" class="form-select" required>
                <option value="">Select Arm</option>
                <option value="Control">Control</option>
                <option value="Treatment A">Treatment A</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Subject Status <span style="color:red">*</span></label>
            <select th:field="*{subjectStatus}" class="form-select" required>
                <option value="SCREENED">SCREENED</option>
                <option value="ENROLLED">ENROLLED</option>
            </select>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" th:field="*{consentProvided}" class="form-check-input" id="consentCheck">
            <label class="form-check-label" for="consentCheck">
                Informed Consent Provided <span style="color:red">*</span>
            </label>
        </div>
        <div class="mt-3">
            <button type="submit" name="action" value="enroll" class="btn btn-success">Enroll</button>
            <button type="submit" name="action" value="screen" class="btn btn-success">Screen</button>
            <button type="submit" name="action" value="withdraw" class="btn btn-success">Withdraw</button>
        </div>

    </form>

</div>
<script src="/js/enrollment.js"></script>

</body>
</html>
