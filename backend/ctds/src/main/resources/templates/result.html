<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Saved - Lab Sample Tracking</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="brand"><span class="dot"></span> Lab Sample &amp; IP Tracking</div>
    <div class="nav-links">
        <a th:href="@{/UserForm}">Add Sample</a>
        <a th:href="@{/sample/list}">Show All</a>
        <a th:href="@{/sample/search-form}">Search</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-title">Submission Result</div>
        <div class="card-body">
            <div class="msg msg-success">Sample saved successfully.</div>

            <div class="grid">
                <div class="item">
                    <div class="label">Sample ID</div>
                    <div class="value" th:text="${sample != null ? sample.sampleId : subId}">--</div>
                </div>
                <div class="item">
                    <div class="label">Subject ID</div>
                    <div class="value" th:text="${sample != null ? sample.subjectId : '--'}">--</div>
                </div>
                <div class="item">
                    <div class="label">Collection Date</div>
                    <div class="value" th:text="${sample != null ? sample.collectionDate : '--'}">--</div>
                </div>
                <div class="item">
                    <div class="label">Status</div>
                    <div class="value">
                        <span th:if="${sample != null and sample.sampleStatus != null}"
                              th:classappend="'badge-' + ${sample.sampleStatus.name().toLowerCase()}"
                              class="badge"
                              th:text="${sample.sampleStatus.displayName}">Collected</span>
                        <span th:unless="${sample != null and sample.sampleStatus != null}">--</span>
                    </div>
                </div>
                <div class="item">
                    <div class="label">Lab Result</div>
                    <div class="value" th:text="${sample != null and sample.labResult != null ? sample.labResult : '--'}">--</div>
                </div>
            </div>

            <div class="actions" style="margin-top:20px;">
                <a class="btn" th:href="@{/UserForm}">Add Another</a>
                <a class="btn btn-outline" th:href="@{/sample/list}">Show All</a>
                <a class="btn btn-outline" th:href="@{/sample/search-form}">Search</a>
            </div>
        </div>
    </div>
</div>

<footer class="footer">&copy; 2026 Clinical Trial &amp; Drug Development Tracking System</footer>
</body>
</html>
