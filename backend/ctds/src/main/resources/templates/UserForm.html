<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sample - Lab Sample Tracking</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="brand"><span class="dot"></span> Lab Sample &amp; IP Tracking</div>
    <div class="nav-links">
        <a th:href="@{/UserForm}">Add Sample</a>
        <a th:href="@{/sample/list}">Show All</a>
        <a th:href="@{/sample/search-form}">Search</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-title">Collect New Sample</div>
        <div class="card-body">
            <form th:action="@{/saveUser}" th:object="${user}" method="post">
                <div class="grid">
                    <div class="field">
                        <label for="subjectId">Subject ID</label>
                        <input id="subjectId" type="number" th:field="*{subjectId}" min="1" required>
                    </div>
                    <div class="field">
                        <label for="sampleType">Sample Type</label>
                        <select id="sampleType" th:field="*{sampleType}" required>
                            <option value="">Select sample type</option>
                            <option value="Blood">Blood</option>
                            <option value="Urine">Urine</option>
                            <option value="Saliva">Saliva</option>
                            <option value="Serum">Serum</option>
                            <option value="Plasma">Plasma</option>
                            <option value="Tissue">Tissue</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="collectionDate">Collection Date</label>
                        <input id="collectionDate" type="date" th:field="*{collectionDate}" required>
                    </div>
                    <div class="field">
                        <label for="sampleStatus">Sample Status</label>
                        <select id="sampleStatus" th:field="*{sampleStatus}">
                            <option th:value="COLLECTED">Collected</option>
                            <option th:value="IN_TRANSIT">In Transit</option>
                            <option th:value="ANALYZED">Analyzed</option>
                            <option th:value="DESTROYED">Destroyed</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="labResult">Lab Result</label>
                    <textarea id="labResult" th:field="*{labResult}" placeholder="Enter lab findings / result..."></textarea>
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Save Sample</button>
                    <a class="btn btn-outline" th:href="@{/sample/list}">Show All</a>
                    <a class="btn btn-outline" th:href="@{/sample/search-form}">Search</a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="footer">&copy; 2026 Clinical Trial &amp; Drug Development Tracking System</footer>
</body>
</html>
