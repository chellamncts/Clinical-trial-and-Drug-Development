<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adverse Event Tracking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef3f1;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Header */
        .header {
            background-color: #145a32;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h4 {
            margin: 0;
            font-weight: 600;
        }

        .header-buttons .btn {
            margin-left: 10px;
        }

        /* Card */
        .form-card {
            background: #ffffff;
            border-radius: 15px;
            max-width: 900px;
            margin: 40px auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header-custom {
            background-color: #145a32;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .card-body {
            padding: 30px;
        }

        /* Inputs */
        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #cdd6d4;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        /* Buttons */
        .btn-primary-custom {
            background-color: #145a32;
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            border: none;
        }

        .btn-outline-custom {
            border: 1px solid #145a32;
            color: #145a32;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .btn-primary-custom:hover {
            background-color: #0f4426;
        }

        .btn-outline-custom:hover {
            background-color: #145a32;
            color: white;
        }

        footer {
            text-align: center;
            color: white;
            background-color: #145a32;
            padding: 10px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h4>● Adverse Event Tracking</h4>

    <div class="header-buttons">
        <a th:href="@{/events/all}" class="btn btn-outline-light">Show All</a>
    </div>
</div>

<!-- FORM CARD -->
<div class="form-card">

    <div class="card-header-custom">
        Report New Event
    </div>

    <div class="card-body">

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/events/save}" th:object="${event}" method="post">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Subject ID <span class="text-danger">*</span></label>
                <input type="text" class="form-control" th:field="*{subjectId}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Severity <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{severity}">
                    <option th:each="s : ${severityOptions}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Onset Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" th:field="*{eventOnsetDate}" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Status <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{eventStatus}">
                    <option value="">-- Select Status --</option>
                    <option value="REPORTED">REPORTED</option>
                    <option value="UNDER REVIEW">UNDER REVIEW</option>
                    <option value="RESOLVED">RESOLVED</option>
                    <option value="FATAL">FATAL</option>
                </select>
            </div>

            <div class="col-12 mb-3">
                <label>Event Description <span class="text-danger">*</span></label>
                <textarea class="form-control" th:field="*{eventDescription}"></textarea>
            </div>

        </div>

        <button type="submit" class="btn btn-success">Submit</button>

        </form>
</div>

</div>

<!-- FOOTER -->
<footer>
    © 2026 Clinical Trial & Tracking System
</footer>

</body>
</html>
