<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adverse Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6faf7; }
        .header { background-color: #145a32; color: #fff; padding: 14px 20px; }
        .form-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .submit-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1055;
            background-color: #198754;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .submit-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div id="submitToast" th:if="${message}" class="submit-toast show" th:text="${message}">Event submitted successfully.</div>

<div class="header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Adverse Event Tracking</h5>
    <div class="d-flex gap-2">
        <a th:href="@{/events/list}" class="btn btn-outline-light btn-sm">Show All</a>
        <a th:href="@{/events/pharma/dashboard(section='dashboard')}" class="btn btn-light btn-sm">Dashboard</a>
    </div>
</div>

<div class="container py-4">
    <div class="form-card p-4">
        <h5 class="mb-3">Report New Event</h5>
        <form th:action="@{/events/save}" th:object="${event}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Subject ID <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{subjectId}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Severity <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{severity}" required>
                        <option value="">-- Select Severity --</option>
                        <option th:each="severityOption : ${severities}"
                                th:value="${severityOption.name()}"
                                th:text="${severityOption.name()}">MILD</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Onset Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" th:field="*{eventOnsetDate}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Event Status <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{eventStatus}" required>
                        <option value="">-- Select Status --</option>
                        <option th:each="statusOption : ${eventStatuses}"
                                th:value="${statusOption.name()}"
                                th:text="${#strings.replace(statusOption.name(), '_', ' ')}">REPORTED</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label>Event Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" th:field="*{eventDescription}" rows="3" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
            <a th:href="@{/events/list}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
