<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search by Subject ID - Lab Sample Tracking</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="brand"><span class="dot"></span> Lab Sample &amp; IP Tracking</div>
    <div class="nav-links">
        <a th:href="@{/UserForm}">Add Sample</a>
        <a th:href="@{/sample/list}">Show All</a>
        <a th:href="@{/sample/search-form}">Search</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-title">Search by Subject ID</div>
        <div class="card-body">
            <div th:if="${error}" class="msg msg-error" th:text="${error}"></div>
            <div th:if="${success}" class="msg msg-success" th:text="${success}"></div>

            <form th:action="@{/sample/search}" method="get">
                <div class="grid">
                    <div class="field">
                        <label for="subjectId">Search by Subject ID</label>
                        <input id="subjectId" type="number" name="subjectId" min="1" placeholder="Enter Subject ID" required>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn" type="submit">Search</button>
                    <a class="btn btn-outline" th:href="@{/sample/list}">Show All</a>
                    <a class="btn btn-outline" th:href="@{/UserForm}">+ New Sample</a>
                </div>
            </form>

            <!-- Multiple samples result -->
            <div th:if="${samples != null and !samples.isEmpty()}" style="margin-top:24px;">
                <h3 style="color:#0a3a23;" th:text="'Subject ' + ${subjectId} + ' - Found ' + ${samples.size()} + ' sample(s)'">Results</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr><th>ID</th><th>Subject</th><th>Type</th><th>Date</th><th>Lab Result</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${samples}">
                            <td th:text="${s.sampleId}">--</td>
                            <td th:text="${s.subjectId}">--</td>
                            <td th:text="${s.sampleType}">--</td>
                            <td th:text="${s.collectionDate}">--</td>
                            <td th:text="${s.labResult != null ? s.labResult : '--'}">--</td>
                            <td>
                                <span th:if="${s.sampleStatus != null}" class="badge"
                                      th:classappend="'badge-' + ${s.sampleStatus.name().toLowerCase()}"
                                      th:text="${s.sampleStatus.displayName}">Collected</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer">&copy; 2026 Clinical Trial &amp; Drug Development Tracking System</footer>
</body>
</html>
