<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management - Clinical Trial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/adminDashboard.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>Admin Dashboard</h3>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a class="active" th:href="@{/userManagement}">User Management</a>
    <a th:href="@{/createProtocol}">Protocol Creation</a>
    <a th:href="@{/sites}">Site Activation</a>
    <a href="#">Reports</a>
    <a th:href="@{/logout}">Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">
    <h4>User Management</h4>

    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">+ Add New User</button>
    </div>

    <div class="card p-3 mb-4">
        <div class="row g-2 align-items-center">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Search users by username or role">
            </div>
            <div class="col-md-3">
                <select id="roleFilter" class="form-select">
                    <option value="">Filter by Role</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">Filter by Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4">
        <h6>Registered Users</h6>
        <table class="table table-striped" id="userTable">
            <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${allUsers}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">admin</td>
                <td th:text="${user.role}" class="role-cell">ADMIN</td>
                <td th:text="${user.active} ? 'Active' : 'Inactive'" th:attr="data-status=${user.active} ? 'ACTIVE' : 'INACTIVE'" class="status-cell">Active</td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer th:replace="~{fragments/footer :: adminFooter}"></footer>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/userManagement}" th:object="${users}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{passwordHash}" class="form-control" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select th:field="*{role}" class="form-select" required>
                            <option value="" disabled selected>Select role</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterTable() {
        const search = document.getElementById("searchInput").value.toLowerCase().trim();
        const role = document.getElementById("roleFilter").value;
        const status = document.getElementById("statusFilter").value;
        const rows = document.querySelectorAll("#userTable tbody tr");

        rows.forEach(row => {
            const username = row.cells[1].innerText.toLowerCase();
            const rowRole = row.querySelector(".role-cell").innerText.trim();
            const rowStatus = row.querySelector(".status-cell").getAttribute("data-status");

            const searchMatch = !search || username.includes(search) || rowRole.toLowerCase().includes(search);
            const roleMatch = !role || rowRole === role;
            const statusMatch = !status || rowStatus === status;

            row.style.display = (searchMatch && roleMatch && statusMatch) ? "" : "none";
        });
    }

    document.getElementById("searchInput").addEventListener("keyup", filterTable);
    document.getElementById("roleFilter").addEventListener("change", filterTable);
    document.getElementById("statusFilter").addEventListener("change", filterTable);
</script>

</body>
</html>
