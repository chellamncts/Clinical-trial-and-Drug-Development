<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Scheduling - Clinical Trial</title>
    <link rel="stylesheet" th:href="@{/css/visitScheduling.css}">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a th:href="@{/crcDashboard}">Dashboard</a></li>
        <li><a th:href="@{/subjects}">Subject Enrollment</a></li>
        <li><a class="active" th:href="@{/visits/visitSchedulingForm}">Visit Scheduling</a></li>
        <li><a th:href="@{/crfs}">CRFs</a></li>
        <li><a th:href="@{/queries}">Queries</a></li>
        <li><a th:href="@{/reports}">Reports</a></li>
        <li><a th:href="@{/logout}">Logout</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <nav class="navbar">
        <div class="brand"><span class="dot"></span> Clinical Trial & Drug Development Tracking</div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title">Schedule New Visit</div>
            <div class="card-body">
                <form th:action="@{/visits/schedule}" th:object="${visit}" method="post">
                    <div class="grid">
                        <div class="field">
                            <label for="subjectId">Subject ID <span class="text-danger">*</span></label>
                            <input id="subjectId" type="number" th:field="*{subjectId}" min="1" required>
                        </div>
                        <div class="field">
                            <label for="visitName">Visit Name <span class="text-danger">*</span></label>
                            <input id="visitName" type="text" th:field="*{visitName}" required>
                        </div>
                        <div class="field">
                            <label for="visitDate">Visit Date <span class="text-danger">*</span></label>
                            <input id="visitDate" type="date" th:field="*{visitDate}"
                                   th:attr="min=${#dates.format(#dates.createNow(),'yyyy-MM-dd')}" required>
                        </div>
                        <div class="field">
                            <label for="crfStatus">CRF Status <span class="text-danger">*</span></label>
                            <select id="crfStatus" th:field="*{crfStatus}" required>
                                <option value="">Select status</option>
                                <option value="PENDING">Pending</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="LOCKED">Locked</option>
                            </select>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn" type="submit">Schedule Visit</button>
                        <a class="btn btn-outline" th:href="@{/visits/list}">Show All</a>
                        <a class="btn btn-outline" th:href="@{/visits/search-form}">Search</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">&copy; 2026 Clinical Trial & Drug Development Tracking System</footer>
</div>

</body>
</html>
