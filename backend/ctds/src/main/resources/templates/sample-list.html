<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Samples - Lab Sample Tracking</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="brand"><span class="dot"></span> Lab Sample &amp; IP Tracking</div>
    <div class="nav-links">
        <a th:href="@{/UserForm}">Add Sample</a>
        <a th:href="@{/sample/list}">Show All</a>
        <a th:href="@{/sample/search-form}">Search</a>
    </div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat">
            <div class="num" th:text="${totalCount != null ? totalCount : (samples != null ? samples.size() : 0)}">0</div>
            <div class="cap">Total Samples</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">All Samples</div>
        <div class="card-body">
            <div th:if="${error}" class="msg msg-error" th:text="${error}"></div>

            <div th:if="${samples == null or samples.isEmpty()}" class="empty">No samples found.</div>

            <div class="table-wrap" th:if="${samples != null and !samples.isEmpty()}">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Subject</th><th>Type</th><th>Collection Date</th><th>Lab Result</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${samples}">
                        <td th:text="${s.sampleId}">--</td>
                        <td th:text="${s.subjectId}">--</td>
                        <td th:text="${s.sampleType}">--</td>
                        <td th:text="${s.collectionDate}">--</td>
                        <td th:text="${s.labResult != null ? s.labResult : '--'}">--</td>
                        <td>
                            <span th:if="${s.sampleStatus != null}" class="badge"
                                  th:classappend="'badge-' + ${s.sampleStatus.name().toLowerCase()}"
                                  th:text="${s.sampleStatus.displayName}">Collected</span>
                        </td>
                        <td><a class="btn btn-outline" th:href="@{/sample/view/{id}(id=${s.sampleId})}">View</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="actions" style="margin-top:18px;">
                <a class="btn" th:href="@{/UserForm}">Add Sample</a>
                <a class="btn btn-outline" th:href="@{/sample/search-form}">Search</a>
            </div>
        </div>
    </div>
</div>

<footer class="footer">&copy; 2026 Clinical Trial &amp; Drug Development Tracking System</footer>
</body>
</html>
