<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adverse Event History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6faf7; }
        .header { background-color: #145a32; color: #fff; padding: 14px 20px; }
        .card-shell { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .submit-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1055;
            background-color: #198754;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .submit-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div id="submitToast" th:if="${message}" class="submit-toast show" th:text="${message}">Event submitted successfully.</div>

<div class="header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Adverse Event History</h5>
    <div class="d-flex gap-2">
        <a th:href="@{/events/form}" class="btn btn-light btn-sm">Add Event</a>
        <a th:href="@{/events/pharma/dashboard(section='dashboard')}" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</div>

<div class="container py-4">
    <div class="card-shell p-4">
        <form method="get" th:action="@{/events/list}" class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" name="searchSubjectId" class="form-control"
                       placeholder="Search by Subject ID" th:value="${searchSubjectId}">
            </div>
            <div class="col-md-3">
                <select name="searchSeverity" class="form-select">
                    <option value="">All Severity</option>
                    <option th:each="severityOption : ${severities}"
                            th:value="${severityOption.name()}"
                            th:text="${severityOption.name()}"
                            th:selected="${searchSeverity == severityOption.name()}">MILD</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="searchStatus" class="form-select">
                    <option value="">All Status</option>
                    <option th:each="statusOption : ${eventStatuses}"
                            th:value="${statusOption.name()}"
                            th:text="${#strings.replace(statusOption.name(), '_', ' ')}"
                            th:selected="${searchStatus == statusOption.name()}">REPORTED</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-success">Search</button>
                <a class="btn btn-outline-secondary" th:href="@{/events/list}">Clear</a>
            </div>
        </form>

        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Subject ID</th>
                <th>Date</th>
                <th>Description</th>
                <th>Severity</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.eventId}">1</td>
                <td th:text="${event.subjectId}">S-1001</td>
                <td th:text="${event.eventOnsetDate}">2026-06-01</td>
                <td th:text="${event.eventDescription}">Nausea after dose</td>
                <td th:text="${event.severity}">MILD</td>
                <td th:text="${event.eventStatus}">REPORTED</td>
            </tr>
            <tr th:if="${#lists.isEmpty(events)}">
                <td colspan="6" class="text-center text-muted">No adverse events found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const submitToast = document.getElementById('submitToast');
    if (submitToast) {
        setTimeout(() => submitToast.classList.remove('show'), 2500);
    }
</script>

</body>
</html>
