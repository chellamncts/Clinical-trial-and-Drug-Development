<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

<h3>Adverse Event History</h3>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Subject ID</th>
        <th>Date</th>
        <th>Description</th>
        <th>Severity</th>
        <th>Status</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="event : ${events}">
        <td th:text="${event.id}"></td>
        <td th:text="${event.subjectId}"></td>
        <td th:text="${event.eventOnsetDate}"></td>
        <td th:text="${event.eventDescription}"></td>
        <td th:text="${event.severity}"></td>
        <td th:text="${event.eventStatus}"></td>
    </tr>
    </tbody>

</table>

<a th:href="@{/events/new}" class="btn btn-success">Add Event</a>

</body>
</html>
