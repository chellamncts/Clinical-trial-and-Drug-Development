spring.application.name=ctds

server.port=8084

# Serve the project's /frontend folder as the static web root.
# Multiple candidate paths are listed so it works whether the app is launched from
# the project root, /backend, or /backend/ctds. index.html is used as the welcome page for "/".
spring.web.resources.static-locations=file:./frontend/,file:../frontend/,file:../../frontend/,classpath:/static/

spring.datasource.url=jdbc:mysql://localhost:3306/clinical_trial?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect