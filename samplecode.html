<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample & Drug Tracking</title>

<!-- ✅ Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ✅ Background */
body {
    background: linear-gradient(to right, #e6ffe6, #f2fff2);
    font-family: Arial, sans-serif;
}

/* ✅ Title */
h1 {
    color: #155724;
    font-weight: bold;
}

/* ✅ Section Box */
.section-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 6px solid #28a745;
}

/* ✅ Clean Section Titles */
.section-title {
    color: #2c3e50;
    font-weight: 600;
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 5px;
    margin-bottom: 15px;
}

/* ✅ Labels */
label {
    font-weight: 500;
    color: #155724;
}

/* ✅ Input Focus */
.form-control:focus, .form-select:focus {
    border-color: #28a745;
    box-shadow: 0 0 5px rgba(40, 167, 69, 0.3);
}

/* ✅ Buttons */
.btn-primary {
    background-color: #28a745;
    border: none;
}

.btn-primary:hover {
    background-color: #218838;
}

.btn-success {
    background-color: #20c997;
    border: none;
}

.btn-success:hover {
    background-color: #198754;
}

.btn-danger {
    background-color: #6c757d;
    border: none;
}

.btn-danger:hover {
    background-color: #495057;
}
</style>

<script>
// ✅ Sample Save
function saveSample() {
    let subject = document.getElementById("s1").value;
    let type = document.getElementById("s2").value;

    alert("Sample Saved!\nSubject: " + subject + "\nType: " + type);
}

// ✅ Drug Dispense
function dispenseDrug() {
    let subject = document.getElementById("d1").value;
    let drug = document.getElementById("d2").value;

    alert("Drug Dispensed!\nSubject: " + subject + "\nDrug: " + drug);
}

// ✅ Lab Result
function saveResult() {
    let sample = document.getElementById("r1").value;
    let result = document.getElementById("r2").value;

    alert("Result Saved!\nSample ID: " + sample + "\nResult: " + result);
}
</script> 

</head>

<body class="container mt-4">

<h1 class="text-center mb-4">Lab Sample & Investigational Product Tracking</h1>

<!-- ✅ SAMPLE COLLECTION -->
<div class="section-box shadow-sm">
<h4 class="section-title">🧪 Sample Collection</h4>

<div class="mb-3">
<label class="form-label">Subject ID</label>
<input type="text" id="s1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Sample Type</label>
<input type="text" id="s2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Collection Date</label>
<input type="date" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Sample Status</label>
<select class="form-select">
    <option>Collected</option>
    <option>In Transit</option>
    <option>Analyzed</option>
    <option>Destroyed</option>
</select>
</div>

<button class="btn btn-primary" onclick="saveSample()">Save Sample</button>
</div>

<!-- ✅ DRUG DISPENSE -->
<div class="section-box shadow-sm">
<h4 class="section-title">💊 Investigational Product Dispense</h4>

<div class="mb-3">
<label class="form-label">Subject ID</label>
<input type="text" id="d1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Drug Name</label>
<input type="text" id="d2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Batch Number</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Dispense Date</label>
<input type="date" class="form-control">
</div>

<button class="btn btn-success" onclick="dispenseDrug()">Dispense Drug</button>
</div>

<!-- LAB RESULT -->
<div class="section-box shadow-sm">
<h4 class="section-title">Lab Result Entry</h4>

<div class="mb-3">
<label class="form-label">Sample ID</label>
<input type="text" id="r1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Lab Result</label>
<input type="text" id="r2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Result Date</label>
<input type="date" class="form-control">
</div>

<button class="btn btn-danger" onclick="saveResult()">Save Result</button>
</div>

</body>
</html>
