<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample & Drug Tracking</title>

<!-- ✅ Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #e6f2ff;
}
.section-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
h1 {
    color: #003366;
}
</style>

<script>
// ✅ Sample Save
function saveSample() {
    let subject = document.getElementById("s1").value;
    let type = document.getElementById("s2").value;

    alert("Sample Saved!\nSubject: " + subject + "\nType: " + type);
}

// ✅ Drug Dispense
function dispenseDrug() {
    let subject = document.getElementById("d1").value;
    let drug = document.getElementById("d2").value;

    alert("Drug Dispensed!\nSubject: " + subject + "\nDrug: " + drug);
}

// ✅ Lab Result
function saveResult() {
    let sample = document.getElementById("r1").value;
    let result = document.getElementById("r2").value;

    alert("Result Saved!\nSample ID: " + sample + "\nResult: " + result);
}
</script> 

</head>

<body class="container mt-4">

<h1 class="text-center mb-4">Lab Sample & Investigational Product Tracking</h1>

<!-- ✅ SAMPLE COLLECTION -->
<div class="section-box shadow-sm">
<h4 class="text-primary">Sample Collection</h4>

<div class="mb-3">
<label class="form-label">Subject ID</label>
<input type="text" id="s1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Sample Type</label>
<input type="text" id="s2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Collection Date</label>
<input type="date" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Sample Status</label>
<select class="form-select">
    <option>Collected</option>
    <option>In Transit</option>
    <option>Analyzed</option>
    <option>Destroyed</option>
</select>
</div>

<button class="btn btn-primary" onclick="saveSample()">Save Sample</button>
</div>

<!-- ✅ DRUG DISPENSE -->
<div class="section-box shadow-sm">
<h4 class="text-success">Investigational Product Dispense</h4>

<div class="mb-3">
<label class="form-label">Subject ID</label>
<input type="text" id="d1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Drug Name</label>
<input type="text" id="d2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Batch Number</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Dispense Date</label>
<input type="date" class="form-control">
</div>

<button class="btn btn-success" onclick="dispenseDrug()">Dispense Drug</button>
</div>

<!-- ✅ LAB RESULT -->
<div class="section-box shadow-sm">
<h4 class="text-danger">Lab Result Entry</h4>

<div class="mb-3">
<label class="form-label">Sample ID</label>
<input type="text" id="r1" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Lab Result</label>
<input type="text" id="r2" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Result Date</label>
<input type="date" class="form-control">
</div>

<button class="btn btn-danger" onclick="saveResult()">Save Result</button>
</div>

</body>
</html>
