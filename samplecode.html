<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample & Drug Tracking</title>
</head>

<body>

<h1 align="center">Lab Sample & Investigational Product Tracking</h1>

<h2>Sample Collection</h2>

<label>Subject ID</label><br>
<input type="text" placeholder="Enter Subject ID"><br><br>

<label>Sample Type</label><br>
<input type="text" placeholder="Blood / Urine / Tissue"><br><br>

<label>Collection Date</label><br>
<input type="date"><br><br>

<label>Sample Status</label><br>
<select>
    <option>Collected</option>
    <option>In Transit</option>
    <option>Analyzed</option>
    <option>Destroyed</option>
</select><br><br>

<button>Save Sample</button>

<hr>

<h2>Investigational Product Dispense</h2>

<label>Subject ID</label><br>
<input type="text" placeholder="Enter Subject ID"><br><br>

<label>Drug Name</label><br>
<input type="text" placeholder="Enter Drug Name"><br><br>

<label>Batch Number</label><br>
<input type="text" placeholder="Enter Batch Number"><br><br>

<label>Dispense Date</label><br>
<input type="date"><br><br>

<button>Dispense Drug</button>

<hr>

<h2>Lab Result Entry</h2>

<label>Sample ID</label><br>
<input type="text" placeholder="Enter Sample ID"><br><br>

<label>Lab Result</label><br>
<input type="text" placeholder="Enter Result"><br><br>

<label>Result Date</label><br>
<input type="date"><br><br>

<button>Save Result</button>

</body>
</html>
