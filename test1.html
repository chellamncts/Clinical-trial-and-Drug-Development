<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visit Scheduling & CRF Capture</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #e6f7ff; 
      font-family: Arial, sans-serif;
    }
    h1, h2 {
      color: #3d5c3d; 
    }
    .btn-custom {
      background-color: #3d5c3d; 
      color: #ffffff;
    }
    .btn-custom:hover {
      background-color: #2e472e;
    }
    .card {
      border: 1px solid #3d5c3d;
    }
    .table thead {
      background-color: #3d5c3d;
      color: #ffffff;
    }
  </style>
</head>
<body class="container py-4">

  <h1 class="text-center mb-4">Visit Scheduling & Case Report Form Capture</h1>

  <!-- Schedule Visit Form-->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Schedule Visit</h2>
      <form id="scheduleVisitForm">
        <div class="mb-3">
          <label for="subjectId" class="form-label">Subject ID</label>
          <input type="text" class="form-control" id="subjectId" name="subjectId" required>
        </div>
        <div class="mb-3">
          <label for="visitName" class="form-label">Visit Name</label>
          <input type="text" class="form-control" id="visitName" name="visitName" required>
        </div>
        <div class="mb-3">
          <label for="visitDate" class="form-label">Visit Date</label>
          <input type="date" class="form-control" id="visitDate" name="visitDate" required>
        </div>
        <button type="submit" class="btn btn-custom">Schedule Visit</button>
      </form>
    </div>
  </div>

  <!-- Record CRF Data -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Record CRF Data</h2>
      <form id="recordCrfForm">
        <div class="mb-3">
          <label for="visitId" class="form-label">Visit ID</label>
          <input type="text" class="form-control" id="visitId" name="visitId" required>
        </div>
        <div class="mb-3">
          <label for="crfStatus" class="form-label">CRF Status</label>
          <select class="form-select" id="crfStatus" name="crfStatus">
            <option value="PENDING">PENDING</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="LOCKED">LOCKED</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="queryCount" class="form-label">Query Count</label>
          <input type="number" class="form-control" id="queryCount" name="queryCount" min="0">
        </div>
        <button type="submit" class="btn btn-custom">Record CRF Data</button>
      </form>
    </div>
  </div>

  <!-- Lock CRF -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Lock CRF</h2>
      <form id="lockCrfForm">
        <div class="mb-3">
          <label for="lockVisitId" class="form-label">Visit ID</label>
          <input type="text" class="form-control" id="lockVisitId" name="lockVisitId" required>
        </div>
        <button type="submit" class="btn btn-custom">Lock CRF</button>
      </form>
    </div>
  </div>

  <!-- Visit History -->
  <div class="card mb-4">
    <div class="card-body">
      <h2>Visit History</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Visit ID</th>
            <th>Subject ID</th>
            <th>Visit Name</th>
            <th>Visit Date</th>
            <th>CRF Status</th>
            <th>Query Count</th>
          </tr>
        </thead>
        <tbody id="visitHistoryTable">
          <!-- Dynamic rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
