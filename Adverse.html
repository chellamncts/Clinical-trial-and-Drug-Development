<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adverse Event Reporting</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f4f6f8;
}

header, footer {
    text-align: center;
    padding: 10px;
    background-color: #2c3e50;
    color: white;
    border-radius: 5px;
}

h2 {
    color: #333;
}

form {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    width: 400px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select, textarea, button {
    width: 100%;
    margin: 8px 0;
    padding: 8px;
}

button {
    cursor: pointer;
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    width: 90%;
    background: #fff;
}

table, th, td {
    border: 1px solid #ccc;
}

th {
    background-color: #e3e6ea;
}

th, td {
    padding: 10px;
    text-align: left;
}

.action-btn {
    background: red;
    color: white;
    border: none;
    padding: 5px;
    cursor: pointer;
}

.search-box {
    width: 300px;
    padding: 8px;
}
</style>
</head>

<body>

<header>
    <h1>Clinical Trial System</h1>
</header>

<h2>Adverse Event Reporting</h2>

<form id="eventForm">
    <label>Event ID</label>
    <input type="text" id="eventId" required>

    <label>Subject ID</label>
    <input type="text" id="subjectId" required>

    <label>Event Description</label>
    <textarea id="description" required></textarea>

    <label>Event Onset Date</label>
    <input type="date" id="onsetDate" required>

    <label>Severity</label>
    <select id="severity">
        <option>MILD</option>
        <option>MODERATE</option>
        <option>SEVERE</option>
    </select>

    <label>Event Status</label>
    <select id="status">
        <option>REPORTED</option>
        <option>UNDER_REVIEW</option>
        <option>RESOLVED</option>
        <option>FATAL</option>
    </select>

    <button type="button" onclick="addEvent()">Submit</button>
</form>

<h3>Search Events</h3>
<input type="text" class="search-box" onkeyup="searchTable()" placeholder="Search by Event ID or Subject ID">

<h3>Event History</h3>

<button onclick="clearTable()">Clear All Records</button>

<table id="eventTable">
<thead>
<tr>
    <th>Event ID</th>
    <th>Subject ID</th>
    <th>Description</th>
    <th>Onset Date</th>
    <th>Severity</th>
    <th>Status</th>
    <th>Reported At</th>
    <th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<footer>
    <p>© 2026 Clinical Safety Reporting System</p>
</footer>

<script>

function addEvent() {
    const eventId = document.getElementById("eventId").value;
    const subjectId = document.getElementById("subjectId").value;
    const description = document.getElementById("description").value;
    const onsetDate = document.getElementById("onsetDate").value;

    // ✅ Simple validation
    if (!eventId || !subjectId || !description || !onsetDate) {
        alert("Please fill all fields!");
        return;
    }

    const table = document.getElementById("eventTable").getElementsByTagName('tbody')[0];
    const row = table.insertRow();

    const timestamp = new Date().toLocaleString();

    row.insertCell(0).innerText = eventId;
    row.insertCell(1).innerText = subjectId;
    row.insertCell(2).innerText = description;
    row.insertCell(3).innerText = onsetDate;
    row.insertCell(4).innerText = document.getElementById("severity").value;
    row.insertCell(5).innerText = document.getElementById("status").value;
    row.insertCell(6).innerText = timestamp;

    // ✅ Delete button
    const actionCell = row.insertCell(7);
    const deleteBtn = document.createElement("button");
    deleteBtn.innerText = "Delete";
    deleteBtn.className = "action-btn";

    deleteBtn.onclick = function () {
        table.deleteRow(row.rowIndex - 1);
    };

    actionCell.appendChild(deleteBtn);

    document.getElementById("eventForm").reset();
}

// ✅ Clear table
function clearTable() {
    const tbody = document.getElementById("eventTable").getElementsByTagName('tbody')[0];
    tbody.innerHTML = '';
}

// ✅ Search filter
function searchTable() {
    let input = document.querySelector(".search-box").value.toLowerCase();
    let rows = document.querySelectorAll("#eventTable tbody tr");

    rows.forEach(row => {
        let eventId = row.cells[0].innerText.toLowerCase();
        let subjectId = row.cells[1].innerText.toLowerCase();

        if (eventId.includes(input) || subjectId.includes(input)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }
    });
}

</script>

</body>
</html>
