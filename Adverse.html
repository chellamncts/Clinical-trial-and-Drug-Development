<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adverse Event Reporting</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f4f8f6;
    font-family: 'Segoe UI', sans-serif;
}

/* Header */
.header {
    background: linear-gradient(to right, #198754, #146c43);
    padding: 15px 20px;
    color: white;
}

.header h4 {
    margin: 0;
}

/* Card */
.card {
    border-radius: 10px;
    border: none;
}

/* Labels */
.form-label {
    font-weight: 500;
}

/* Table */
.table {
    background: white;
    border-radius: 8px;
}

/* Button */
.btn-success {
    background-color: #198754;
    border: none;
}

.btn-success:hover {
    background-color: #146c43;
}

</style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">
    <h4>Adverse Event Reporting</h4>
</div>

<div class="container mt-4">

    <!-- ✅ FORM CARD -->
    <div class="card shadow-sm p-4 mb-4">

        <h5 class="mb-3">Report New Adverse Event</h5>

        <form id="eventForm">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Event ID</label>
                    <input type="text" id="eventId" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Subject ID</label>
                    <input type="text" id="subjectId" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Event Description</label>
                <textarea id="description" class="form-control" rows="2" required></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Onset Date</label>
                    <input type="date" id="onsetDate" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Severity</label>
                    <select id="severity" class="form-select">
                        <option>MILD</option>
                        <option>MODERATE</option>
                        <option>SEVERE</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option>REPORTED</option>
                        <option>UNDER REVIEW</option>
                        <option>RESOLVED</option>
                        <option>FATAL</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-success px-4" onclick="addEvent()">
                Submit Report
            </button>

        </form>
    </div>

    <!-- ✅ TABLE -->
    <div class="card shadow-sm p-3">
        <h5 class="mb-3">Reported Adverse Events</h5>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Event ID</th>
                    <th>Subject ID</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Severity</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="eventTable"></tbody>
        </table>
    </div>

</div>

<script>
function addEvent() {

    let id = eventId.value.trim();
    let subject = subjectId.value.trim();
    let desc = description.value.trim();
    let date = onsetDate.value;

    if (!id || !subject || !desc || !date) {
        alert("Please fill all required fields");
        return;
    }

    let table = document.getElementById("eventTable");
    let row = table.insertRow();

    row.insertCell(0).innerText = id;
    row.insertCell(1).innerText = subject;
    row.insertCell(2).innerText = desc;
    row.insertCell(3).innerText = date;
    row.insertCell(4).innerText = severity.value;
    row.insertCell(5).innerText = status.value;

    let btn = document.createElement("button");
    btn.innerText = "Delete";
    btn.className = "btn btn-sm btn-danger";
    btn.onclick = () => row.remove();

    row.insertCell(6).appendChild(btn);

    eventForm.reset();
}
</script>

</body>
</html>
