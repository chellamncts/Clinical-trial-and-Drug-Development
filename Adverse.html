<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adverse Event Reporting</title>

<!-- ✅ Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f8f9fa;
}

/* ✅ Simple hospital header */
.header {
    background: url('https://images.unsplash.com/photo-1586773860418-d37222d8fce3') center/cover;
    height: 150px;
    display: flex;
    align-items: center;
    padding-left: 20px;
    color: white;
}

.header h3 {
    background: rgba(0,0,0,0.5);
    padding: 8px 15px;
    border-radius: 5px;
}
</style>
</head>

<body>

<!-- ✅ Header -->
<div class="header">
    <h3>Adverse Event Reporting</h3>
</div>

<div class="container mt-4">

<!-- ✅ Form -->
<div class="card p-3 shadow-sm mb-4">
<form id="eventForm">

    <input type="text" id="eventId" class="form-control mb-2" placeholder="Event ID" required>

    <input type="text" id="subjectId" class="form-control mb-2" placeholder="Subject ID" required>

    <textarea id="description" class="form-control mb-2" placeholder="Description" required></textarea>

    <input type="date" id="onsetDate" class="form-control mb-2" required>

    <select id="severity" class="form-select mb-2">
        <option>MILD</option>
        <option>MODERATE</option>
        <option>SEVERE</option>
    </select>

    <select id="status" class="form-select mb-2">
        <option>REPORTED</option>
        <option>UNDER_REVIEW</option>
        <option>RESOLVED</option>
        <option>FATAL</option>
    </select>

    <button type="button" class="btn btn-success w-100" onclick="addEvent()">Submit</button>

</form>
</div>

<!-- ✅ Table -->
<table class="table table-bordered" id="eventTable">
<thead class="table-light">
<tr>
<th>Event ID</th>
<th>Subject ID</th>
<th>Description</th>
<th>Date</th>
<th>Severity</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
function addEvent() {

    let id = eventId.value.trim();
    let subject = subjectId.value.trim();
    let desc = description.value.trim();
    let date = onsetDate.value;

    if (!id || !subject || !desc || !date) {
        alert("Fill all fields");
        return;
    }

    let table = document.querySelector("#eventTable tbody");
    let row = table.insertRow();

    row.insertCell(0).innerText = id;
    row.insertCell(1).innerText = subject;
    row.insertCell(2).innerText = desc;
    row.insertCell(3).innerText = date;
    row.insertCell(4).innerText = severity.value;
    row.insertCell(5).innerText = status.value;

    let btn = document.createElement("button");
    btn.innerText = "Delete";
    btn.className = "btn btn-sm btn-danger";
    btn.onclick = () => row.remove();

    row.insertCell(6).appendChild(btn);

    eventForm.reset();
}
</script>

</body>
</html>
