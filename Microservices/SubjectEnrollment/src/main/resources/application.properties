spring.application.name=SubjectEnrollment
server.port=8089

# ?? MySQL DataSource ?????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/subject_enrollment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? Eureka (Service Discovery) ????????????????????????????????
# Set to true only when a Eureka server is running at localhost:8761
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
