<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visit Scheduling · Clinical Trial Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../home/theme.css" />
  <link rel="stylesheet" href="visit.css" />
  <link rel="stylesheet" href="../home/premium.css" />
</head>
<body class="admin">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">CT</span>
      <span>Data Manager</span>
    </div>
    <nav class="side-nav" aria-label="Data Manager sections">
      <button class="nav-item active" data-sec="dashboard">
        <i class="bi bi-speedometer2"></i> Dashboard
      </button>
      <button class="nav-item" data-sec="schedule">
        <i class="bi bi-calendar-plus"></i> Schedule Visit
      </button>
      <button class="nav-item" data-sec="crf">
        <i class="bi bi-clipboard-check"></i> CRF Actions
      </button>
      <button class="nav-item" data-sec="history">
        <i class="bi bi-clock-history"></i> Visit History
      </button>
    </nav>
    <button class="btn logout side-logout" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Toggle menu">
        <i class="bi bi-list"></i>
      </button>
      <h1 id="secTitle">Dashboard</h1>
      <div class="topbar-end">
        <button class="topbar-btn" type="button" title="Notifications">
          <i class="bi bi-bell"></i>
        </button>
        <span class="who" id="who"></span>
      </div>
    </header>

    <!-- ════ DASHBOARD ════ -->
    <section id="dashboard" class="sec active">
      <div class="stats">
        <div class="stat">
          <span class="stat-n" id="cTotal">0</span>
          <span class="stat-l"><i class="bi bi-calendar3 me-1"></i>Total Visits</span>
        </div>
        <div class="stat">
          <span class="stat-n" id="cPending">0</span>
          <span class="stat-l"><i class="bi bi-hourglass-split me-1"></i>Pending CRF</span>
        </div>
        <div class="stat">
          <span class="stat-n" id="cCompleted">0</span>
          <span class="stat-l"><i class="bi bi-check2-circle me-1"></i>Completed</span>
        </div>
        <div class="stat">
          <span class="stat-n" id="cLocked">0</span>
          <span class="stat-l"><i class="bi bi-lock-fill me-1"></i>Locked</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <h2><i class="bi bi-calendar3"></i> All Visits</h2>
          <div class="visit-search-wrap">
            <i class="bi bi-search"></i>
            <input id="visitSearch" placeholder="Search visit or subject…" oninput="filterTable()" aria-label="Search visits" />
          </div>
        </div>
        <div id="tbox"></div>
      </div>
    </section>

    <!-- ════ SCHEDULE VISIT ════ -->
    <section id="schedule" class="sec">
      <div class="sec-head">
        <h2><i class="bi bi-calendar-plus"></i> Schedule a Visit</h2>
      </div>
      <div class="card visit-form-card">
        <div id="smsg"></div>
        <div class="visit-form-grid">
          <div class="vf-field">
            <label for="subjectId"><i class="bi bi-person"></i> Subject ID *</label>
            <input id="subjectId" type="number" min="1" placeholder="e.g. 101" required />
          </div>
          <div class="vf-field">
            <label for="visitName"><i class="bi bi-tag"></i> Visit Name</label>
            <input id="visitName" placeholder="e.g. Baseline, Week 4, End of Study" />
          </div>
          <div class="vf-field">
            <label for="visitDate"><i class="bi bi-calendar-event"></i> Visit Date</label>
            <input id="visitDate" type="date" />
          </div>
          <div class="vf-field">
            <label for="visitWindow"><i class="bi bi-arrows-expand"></i> Visit Window</label>
            <input id="visitWindow" placeholder="e.g. Day 1 ± 3 days" />
          </div>
        </div>
        <div class="visit-form-foot">
          <button id="schBtn" class="btn" onclick="save()">
            <i class="bi bi-calendar-check"></i> Schedule Visit
          </button>
        </div>
      </div>
    </section>

    <!-- ════ CRF ACTIONS ════ -->
    <section id="crf" class="sec">
      <div class="sec-head">
        <h2><i class="bi bi-clipboard-check"></i> CRF Actions</h2>
      </div>
      <div id="crfmsg"></div>
      <div class="card">
        <label for="vid"><i class="bi bi-calendar3"></i> Select Visit</label>
        <select id="vid" onchange="showVisit()"></select>
        <div id="visitDetail" class="visit-detail-box"></div>
        <div class="crf-action-row">
          <div class="vf-field narrow">
            <label for="qc"><i class="bi bi-question-circle"></i> Query Count</label>
            <input id="qc" type="number" value="0" min="0" />
          </div>
          <div class="crf-btns">
            <button class="btn secondary" onclick="recordCrf()">
              <i class="bi bi-clipboard-data"></i> Record CRF Data
            </button>
            <button class="btn crf-lock-btn" onclick="lockCrf()">
              <i class="bi bi-lock-fill"></i> Lock CRF
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ════ VISIT HISTORY ════ -->
    <section id="history" class="sec">
      <div class="sec-head">
        <h2><i class="bi bi-clock-history"></i> Visit History by Subject</h2>
      </div>
      <div class="card">
        <label for="histSubject"><i class="bi bi-person"></i> Subject ID</label>
        <div class="hist-search-row">
          <input id="histSubject" type="number" min="1" placeholder="Enter subject ID" />
          <button class="btn" onclick="loadHistory()"><i class="bi bi-search"></i> Load History</button>
        </div>
        <div id="hbox" style="margin-top:18px"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../home/app.js"></script>
  <script src="visit.js"></script>
  <script src="../home/dashboard.js"></script>
</body>
</html>
