<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Tracking Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f7f6;
}

/* Sidebar */
.sidebar {
    height: 100vh;
    background: #155724;
    color: white;
    padding: 20px;
}

.sidebar h4 {
    color: #d4edda;
}

.sidebar a {
    color: white;
    display: block;
    margin: 10px 0;
    text-decoration: none;
}

.sidebar a:hover {
    color: #a3f7bf;
}

/* Dashboard cards */
.card-box {
    border-left: 5px solid #28a745;
}

.header {
    background: white;
    padding: 15px;
    border-bottom: 1px solid #ddd;
}

.section-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
</style>

<script>
function saveSample() {
    alert("Sample Saved Successfully ✅");
}

function dispenseDrug() {
    alert("Drug Dispensed ✅");
}

function saveResult() {
    alert("Result Stored ✅");
}
</script>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- ✅ Sidebar -->
<div class="col-md-2 sidebar">
    <h4>Dashboard</h4>
    <a href="#">🏠 Home</a>
    <a href="#">🧪 Samples</a>
    <a href="#">💊 Drug Dispense</a>
    <a href="#">🧬 Results</a>
    <a href="#">📊 Reports</a>
</div>

<!-- ✅ Main Content -->
<div class="col-md-10">

<!-- Header -->
<div class="header">
    <h3>Lab Sample & Drug Tracking Dashboard</h3>
</div>

<!-- ✅ Summary Cards -->
<div class="row mt-3">

    <div class="col-md-3">
        <div class="card card-box p-3 shadow-sm">
            <h6>Total Samples</h6>
            <h3>120</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box p-3 shadow-sm">
            <h6>In Transit</h6>
            <h3>45</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box p-3 shadow-sm">
            <h6>Analyzed</h6>
            <h3>60</h3>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-box p-3 shadow-sm">
            <h6>Drugs Dispensed</h6>
            <h3>80</h3>
        </div>
    </div>

</div>

<!-- ✅ SAMPLE COLLECTION -->
<div class="section-box mt-4">
<h5>🧪 Sample Collection</h5>

<input type="text" placeholder="Subject ID" class="form-control mb-2">
<input type="text" placeholder="Sample Type" class="form-control mb-2">
<input type="date" class="form-control mb-2">

<select class="form-select mb-2">
<option>Collected</option>
<option>In Transit</option>
<option>Analyzed</option>
<option>Destroyed</option>
</select>

<button onclick="saveSample()" class="btn btn-success">Save Sample</button>
</div>

<!-- ✅ DRUG DISPENSE -->
<div class="section-box">
<h5>💊 Drug Dispense</h5>

<input type="text" placeholder="Subject ID" class="form-control mb-2">
<input type="text" placeholder="Drug Name" class="form-control mb-2">
<input type="text" placeholder="Batch No" class="form-control mb-2">
<input type="date" class="form-control mb-2">

<button onclick="dispenseDrug()" class="btn btn-primary">Dispense</button>
</div>

<!-- ✅ LAB RESULT -->
<div class="section-box">
<h5>🧬 Lab Results</h5>

<input type="text" placeholder="Sample ID" class="form-control mb-2">
<input type="text" placeholder="Result" class="form-control mb-2">
<input type="date" class="form-control mb-2">

<button onclick="saveResult()" class="btn btn-dark">Save Result</button>
</div>

</div>
</div>
</div>

</body>
</html>
