<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adverse Event Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f3fbf6;
}

/* Header */
header {
    background: #2d6a4f;
    color: #ffffff;
    padding: 18px;
    text-align: center;
}

/* Container */
.container {
    padding: 25px;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h2 {
    margin: 10px 0;
    font-size: 28px;
    color: #1b4332;
}

.card p {
    color: #555;
    font-size: 14px;
}

/* Card Borders */
.green { border-left: 6px solid #52b788; }
.light { border-left: 6px solid #74c69d; }
.soft { border-left: 6px solid #95d5b2; }
.pale { border-left: 6px solid #b7e4c7; }

/* Section Title */
.section-title {
    margin-bottom: 10px;
    color: #2d6a4f;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

th {
    background: #52b788;
    color: white;
    padding: 12px;
    font-size: 14px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eef5f1;
    font-size: 14px;
}

tr:hover {
    background: #f5fbf7;
}

/* Status badges */
.badge {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: white;
}

.REPORTED { background: #52b788; }
.UNDER_REVIEW { background: #f4a261; }
.RESOLVED { background: #2a9d8f; }
.FATAL { background: #e63946; }
</style>
</head>

<body>

<header>
    <h1>Adverse Event Monitoring Dashboard</h1>
</header>

<div class="container">

    <!-- Summary Cards -->
    <div class="cards">
        <div class="card green">
            <h2 id="totalEvents">0</h2>
            <p>Total Events</p>
        </div>
        <div class="card light">
            <h2 id="severeEvents">0</h2>
            <p>Severe Cases</p>
        </div>
        <div class="card soft">
            <h2 id="underReview">0</h2>
            <p>Under Review</p>
        </div>
        <div class="card pale">
            <h2 id="fatalEvents">0</h2>
            <p>Fatal Events</p>
        </div>
    </div>

    <!-- Table -->
    <h2 class="section-title">Adverse Event History</h2>
    <table>
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Subject ID</th>
                <th>Description</th>
                <th>Onset Date</th>
                <th>Severity</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="eventTable"></tbody>
    </table>

</div>

<script>
let events = [
    {
        eventId: "EVT-001",
        subjectId: "SUB-101",
        description: "Headache and nausea",
        date: "2026-06-01",
        severity: "MILD",
        status: "REPORTED"
    },
    {
        eventId: "EVT-002",
        subjectId: "SUB-102",
        description: "Severe allergic reaction",
        date: "2026-06-02",
        severity: "SEVERE",
        status: "UNDER_REVIEW"
    },
    {
        eventId: "EVT-003",
        subjectId: "SUB-103",
        description: "Chest pain",
        date: "2026-06-03",
        severity: "SEVERE",
        status: "FATAL"
    }
];

function renderTable() {
    const table = document.getElementById("eventTable");
    table.innerHTML = "";

    events.forEach(e => {
        table.innerHTML += `
        <tr>
            <td>${e.eventId}</td>
            <td>${e.subjectId}</td>
            <td>${e.description}</td>
            <td>${e.date}</td>
            <td>${e.severity}</td>
            <td><span class="badge ${e.status}">${e.status}</span></td>
        </tr>`;
    });
}

function updateDashboard() {
    document.getElementById("totalEvents").innerText = events.length;

    document.getElementById("severeEvents").innerText =
        events.filter(e => e.severity === "SEVERE").length;

    document.getElementById("underReview").innerText =
        events.filter(e => e.status === "UNDER_REVIEW").length;

    document.getElementById("fatalEvents").innerText =
        events.filter(e => e.status === "FATAL").length;
}

// Initial load
renderTable();
updateDashboard();
</script>

</body>
</html>
