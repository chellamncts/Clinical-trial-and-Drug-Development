<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trial Protocol</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#e6f4ea;">

<div class="container mt-5">
  <div class="card p-4 shadow-sm">
    <h3 class="text-center text-success mb-4">Create Trial Protocol</h3>

    <!-- Protocol Form -->
    <form id="protocolForm">
      <div class="mb-3">
        <label class="form-label">Trial Title</label>
        <input type="text" class="form-control" placeholder="Enter title" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Therapeutic Area</label>
        <input type="text" class="form-control" placeholder="e.g Oncology" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phase</label>
        <select class="form-select" required>
          <option value="">Select Phase</option>
          <option>Phase I</option>
          <option>Phase II</option>
          <option>Phase III</option>
          <option>Phase IV</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" required>
          <option value="">Select Status</option>
          <option>Draft</option>
          <option>Approved</option>
          <option>Active</option>
          <option>Closed</option>
        </select>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success">Submit</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById("protocolForm").addEventListener("submit", function(event) {
    event.preventDefault(); 
    alert("Protocol submitted successfully!");
    window.location.href = "adminDashboard.html"; 
  });
</script>

</body>
</html>
