<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visit Scheduling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../crc css/visitScheduling.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>CRC Dashboard</h3>
    <a href="dashboard.html">Dashboard</a>
    <a href="subjects.html">Subject Enrollment</a>
    <a class="active" href="visits.html">Visit Scheduling</a>
    <a href="crfs.html">CRFs</a>
    <a href="queries.html">Queries</a>
    <a href="reports.html">Reports</a>
    <a href="logout.html">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h4>Visit Scheduling</h4>

    <!-- Summary Panels -->
    <div class="row mb-4">
      <div class="col-md-3"><div class="summary-box"><h6>Scheduled Visits</h6><h3>12</h3></div></div>
      <div class="col-md-3"><div class="summary-box"><h6>Pending CRFs</h6><h3>4</h3></div></div>
      <div class="col-md-3"><div class="summary-box"><h6>Completed CRFs</h6><h3>5</h3></div></div>
      <div class="col-md-3"><div class="summary-box"><h6>Locked CRFs</h6><h3>3</h3></div></div>
    </div>

    <!-- Visit Form -->
    <div class="card p-3 mb-4">
      <h6>Schedule a Visit</h6>
      <form id="visitForm">
        <div class="mb-3">
          <label class="form-label">Subject ID</label>
          <input type="number" class="form-control" id="subjectId" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Visit Name</label>
          <input type="text" class="form-control" id="visitName" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Visit Date</label>
          <input type="date" class="form-control" id="visitDate" required>
        </div>
        <div class="mb-3">
          <label class="form-label">CRF Status</label>
          <select class="form-select" id="crfStatus" required>
            <option value="PENDING">PENDING</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="LOCKED">LOCKED</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Schedule Visit</button>
      </form>
    </div>

</body>
<script>
    const apiBase = "http://localhost:8081/visits";

    // Handle form submission
    document.getElementById("visitForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const visitData = {
      subjectId: document.getElementById("subjectId").value,
      visitName: document.getElementById("visitName").value,
      visitDate: document.getElementById("visitDate").value,
      crfStatus: document.getElementById("crfStatus").value
    };

    try {
      const response = await fetch("http://localhost:8081/visits/schedule", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(visitData)
      });

      if (response.ok) {
        const result = await response.json();
        alert("Visit scheduled successfully! ID: " + result.visitId);
      } else {
        alert("Error scheduling visit");
      }
    } catch (err) {
      console.error(err);
      alert("Server error");
    }
  });

    // Load visit history
    async function loadVisitHistory(subjectId) {
      try {
        const response = await fetch(apiBase + "/history/" + subjectId);
        if (response.ok) {
          const visits = await response.json();
          console.log("Visit history:", visits);
          // TODO: render visits in a table
        }
      } catch (err) {
        console.error(err);
      }
    }
</script>

</html>
