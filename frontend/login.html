<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Clinical App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="wrapper shadow-lg">
  <div class="row align-items-center">

    <!-- ✅ IMAGE (LEFT) -->
    <div class="col-md-7 left-section text-center">
      <img src="assets/image.png" alt="Medical Illustration">
    </div>

    <!-- ✅ LOGIN (RIGHT) -->
    <div class="col-md-5">
      <div class="login-card text-center">

        <img src="assets/logo.png" class="logo mb-2">
        <p class="small text-muted">Lifeline</p>

        <h4>Welcome Back</h4>
        <p class="text-muted small">Please enter your ID to continue</p>

        <form>

          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Enter User ID">
          </div>

          <div class="mb-3">
            <input type="password" class="form-control" placeholder="Enter Password">
          </div>

          <button class="btn btn-login w-100">LOGIN</button>

        </form>

      </div>
    </div>

  </div>
</div>

</body>
</html>
