<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Clinical App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container main-box shadow-lg">
  <div class="row align-items-center">

    
    <div class="col-md-6 text-center">
      <img src="assets/image.png" class="left-image" alt="Medical Illustration">
    </div>

    
    <div class="col-md-6">
      <div class="login-card">

        
        <div class="header-center">
          <img src="assets/logo.png" class="logo mb-2" alt="Logo">
          <h4>Welcome Back</h4>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label>User ID</label>
            <input type="text" class="form-control" placeholder="Enter ID" required>
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="Enter password" required>
          </div>

          <button class="btn btn-login w-100" type="submit">LOGIN</button>
        </form>

      </div>
    </div>

  </div>
</div>

<script>
  // No authentication backend yet — route the user into the CRC dashboard.
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    window.location.href = "/crcDashboard.html";
  });
</script>

</body>
</html>
