<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Clinical Trial App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1D9E75;    
      --secondary: #378ADD;   
      --info: #185FA5;        
      --light: #E1F5EE;      
      --bg: #F7F9F8;         
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .logo {
      height: 60px;       /* increase size */
      width: auto;
      background: none;   /* ensures no white patch */
      display: inline-block;
    }



   .navbar {
      background-color: #ffffff;
      height: 70px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding-left: 20px;   /* moves brand closer to left edge */
      padding-right: 40px;  /* keeps login button slightly inward */
      justify-content: space-between; /* brand left, button right */
    }

    .navbar-brand {
      margin: 0;
      padding-left: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: #185FA5 !important;
      letter-spacing: 1px;
    }

    .navbar-brand img {
      height: 80px;
      width: auto;
      margin-right: 10px;   /* space between logo and text */
    }

    .btn-login {
      background-color: #185FA5;   /* deep blue for contrast */
      color: #fff;
      border-radius: 20px;
      padding: 6px 18px;
      transition: 0.3s;
      margin-right: 20px;   /* pulls login button slightly inward */
    }

    .btn-login:hover {
      background-color: #378ADD;   /* lighter sky blue on hover */
      transform: scale(1.05);
    }


    /* Hero Section */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* padding: 80px 60px; */
      background: linear-gradient(90deg, var(--light), #ffffff);
      min-height: calc(100vh - 70px); 
      padding-top: 40px;     /* reduce top padding */
      padding-bottom: 20px;  /* optional: less bottom space */
      margin-top: -40px;
      padding-left: 60px; 
      padding-right: 40px;
    }

    .hero-text {
      max-width: 50%;
      margin-top: -20px;
    }

    .hero-text h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 600;
      color: #185FA5; /* deep blue for emphasis */
      letter-spacing: 0.5px;
      line-height: 1.2;
    }


    .hero-text p {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 25px;
      font-weight: 400;
      line-height: 1.6;
    }

    .hero-heading {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #185FA5; /* base deep blue */
    }

    .hero-heading .highlight {
      color: #1D9E75; /* olive green accent */
    }

    .hero-heading .accent {
      color: #378ADD; /* sky blue for final word */
    }

    .hero-image img {
      max-width: 320px;
      /* border-radius: 8px; */
      background: none;   /* removes white patch */
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: auto;
      height: auto;
      display: block;
      margin-top: -20px; /* slightly overlaps with text for cohesion */
    }



    .tags span {
      background-color: #ffffff;
      color: var(--info);
      padding: 6px 12px;
      border-radius: 20px;
      margin-right: 10px;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    @media (max-width: 768px) {
      .hero-text,
      .hero-image {
        margin-top: -10px;
      }
    }



    

    /* footer {
      text-align: center;
      padding: 20px;
      background-color: var(--bs-light);
      margin-top: 40px;
      font-size: 0.9rem;
      color: #333;
    } */
  </style>
</head>
<body class="container py-4">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="assets/logo.png" alt="Clinical Trial App Logo" class="logo">
      Clinical Trial App
    </a>


    <div class="d-flex">
      <a href="login.html" class="btn btn-login">Login</a>
    </div>
  </div>
</nav>


   <!-- Hero Section -->
  <section class="hero container-fluid d-flex align-items-center justify-content-between">
    <div class="hero-text">
      <h1 class="hero-heading">
        Track <span class="highlight">Clinical Trials</span> with Ease
      </h1>

      <p>
        Empower researchers and clinicians to manage trial protocols, subject enrollment, 
        visit scheduling, safety monitoring, and lab sample tracking — all in one platform.
      </p>
      <div class="tags">
        <span>For Researchers</span>
        <span>Pharma R&D</span>
        <span>Trial Management</span>
      </div>
    </div>
    <div>
      <img src="assets/homePage1.png" alt="Clinical Trial Illustration">
    </div>
  </section>

  <!-- Footer -->
  <!-- <footer>
    © 2026 Clinical Trial App | Designed for Pharma R&D Training
  </footer> -->

</body>
</html>
