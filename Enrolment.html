<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            background-color: #e8f5e9;
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #1b5e20;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: 1px solid #1b5e20;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b5e20;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        th {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Subject Enrollment & Consent Management</h2>

<form>

    <div class="form-group">
        <label class="form-label">Subject ID</label>
        <input type="text" class="form-control" placeholder="Enter Subject ID">
    </div>

    <div class="form-group">
        <label class="form-label">Protocol ID</label>
        <input type="text" class="form-control" placeholder="Enter Protocol ID">
    </div>

    <div class="form-group">
        <label class="form-label">Site ID</label>
        <input type="text" class="form-control" placeholder="Enter Site ID">
    </div>

    <div class="form-group">
        <label class="form-label">Enrollment Date</label>
        <input type="date" class="form-control">
    </div>

    <div class="form-group">
        <label class="form-label">Study Arm</label>
        <select class="form-select">
            <option>Select Arm</option>
            <option>Control</option>
            <option>Treatment A</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Subject Status</label>
        <select class="form-select">
            <option>SCREENED</option>
            <option>ENROLLED</option>
        </select>
    </div>

    <!-- ✅ Fixed Checkbox -->
    <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="consentCheck">
        <label class="form-check-label" for="consentCheck">
            Informed Consent Provided
        </label>
    </div>

    <div class="mt-3">
        <button type="button">Screen</button>
        <button type="button">Enroll</button>
        <button type="button">Consent</button>
        <button type="button">Withdraw</button>
    </div>

    <table>
        <tr>
            <th>Subject ID</th>
            <th>Protocol ID</th>
            <th>Site ID</th>
            <th>Enrollment Date</th>
            <th>Study Arm</th>
            <th>Status</th>
        </tr>
    </table>

</form>

</div>

</body>
</html>
