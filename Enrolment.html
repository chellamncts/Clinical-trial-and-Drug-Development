<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial;
            background-color: #e8f5e9;
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #1b5e20;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: 1px solid #1b5e20;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b5e20;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        th {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Subject Enrollment & Consent Management</h2>

<form>

    <div class="form-group">
    <label class="form-label">Subject ID <span style="color:red">*</span></label>
<input type="text" class="form-control" placeholder="Enter Subject ID"
       title="Please fill the Subject ID" required>
</div>

<div class="form-group">
    <label class="form-label">Protocol ID <span style="color:red">*</span></label>
<input type="text" class="form-control" placeholder="Enter Protocol ID"
       title="Please fill the Protocol ID" required>
</div>

<div class="form-group">
    <label class="form-label">Site ID <span style="color:red">*</span></label>
<input type="text" class="form-control" placeholder="Enter Site ID"
       title="Please fill the Site ID" required">
</div>

<div class="form-group">
    <label class="form-label">Enrollment Date <span style="color:red">*</span></label>   
<input type="date" class="form-control"
       title="Please select Enrollment Date" required>
</div>

<div class="form-group">
    <label class="form-label">Study Arm <span style="color:red">*</span></label>
    <select class="form-select" title="Please select Study Arm" required>
        <option>Select Arm</option>
        <option>Control</option>
        <option>Treatment A</option>
    </select>
</div>

<div class="form-group">
    <label class="form-label">Subject Status <span style="color:red">*</span></label>
    <select class="form-select" title="Please select Subject Status" required>
        <option>SCREENED</option>
        <option>ENROLLED</option>
    </select>
</div>

<div class="form-group form-check">
    <input type="checkbox" class="form-check-input" id="consentCheck" title="Please provide consent">
    <label class="form-check-label" for="consentCheck">
        Informed Consent Provided <span style="color:red">*</span>
    </label>
</div>
    <div class="mt-3">
        <button type="button">Screen</button>
        <button type="button" id="enrollBtn">Enroll</button>
        <button type="button">Consent</button>
        <button type="button">Withdraw</button>
    </div>

    <table>
        <tr>
            <th>Subject ID</th>
            <th>Protocol ID</th>
            <th>Site ID</th>
            <th>Enrollment Date</th>
            <th>Study Arm</th>
            <th>Status</th>
        </tr>
    </table>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
