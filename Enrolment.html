<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>

    <style>
        body {
            font-family: Arial;
            background-color: white; /* ✅ removed blue background */
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        /* ✅ Bigger buttons */
        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        /* ✅ Table full width */
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

    </style>
</head>

<body>

<div class="container">

<h2>Subject Enrollment & Consent Management</h2>

<form>

    <div class="form-group">
        <label>Subject ID</label><br>
        <input type="text" placeholder="Enter Subject ID">
    </div>

    <div class="form-group">
        <label>Protocol ID</label><br>
        <input type="text" placeholder="Enter Protocol ID">
    </div>

    <div class="form-group">
        <label>Site ID</label><br>
        <input type="text" placeholder="Enter Site ID">
    </div>

    <div class="form-group">
        <label>Enrollment Date</label><br>
        <input type="date">
    </div>

    <div class="form-group">
        <label>Study Arm</label><br>
        <select>
            <option>Select Arm</option>
            <option>Control</option>
            <option>Treatment A</option>
        </select>
    </div>

    <div class="form-group">
        <label>Subject Status</label><br>
        <select>
            <option>SCREENED</option>
            <option>ENROLLED</option>
        </select>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox"> Informed Consent Provided
        </label>
    </div>

    <button type="button">Screen</button>
    <button type="button">Enroll</button>
    <button type="button">Consent</button>
    <button type="button">Withdraw</button>

    <table>
        <tr>
            <th>Subject ID</th>
            <th>Protocol ID</th>
            <th>Site ID</th>
            <th>Enrollment Date</th>
            <th>Study Arm</th>
            <th>Status</th>
        </tr>
    </table>

</form>

</div>

</body>
</html>
