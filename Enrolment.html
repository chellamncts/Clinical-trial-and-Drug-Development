<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #1D9E75;
            --bs-secondary: #378ADD;
            --bs-info: #185FA5;
            --bs-light: #E1F5EE;
            --bs-body-bg: #F7F9F8;
        }
        body {
            font-family: Arial;
            background-color: var(--bs-body-bg);
        }
        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }
        h2 {
            margin-bottom: 20px;
            color: var(--bs-info);
        }
        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: 1px solid var(--bs-info);
            background-color: var(--bs-primary);
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--bs-info);
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }
        th {
            background-color: var(--bs-info);
            color: white;
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        .navbar {
            background-color: var(--bs-info);
        }
    </style>
</head>
<body>
<div class="container">
<h2>Subject Enrollment & Consent Management</h2>
<form>
    <div class="form-group">
        <label class="form-label">Subject ID</label>
        <input type="text" class="form-control" placeholder="Enter Subject ID">
    </div>
    <div class="form-group">
        <label class="form-label">Protocol ID</label>
        <input type="text" class="form-control" placeholder="Enter Protocol ID">
    </div>
    <div class="form-group">
        <label class="form-label">Site ID</label>
        <input type="text" class="form-control" placeholder="Enter Site ID">
    </div>
    <div class="form-group">
        <label class="form-label">Enrollment Date</label>
        <input type="date" class="form-control">
    </div>
    <div class="form-group">
        <label class="form-label">Study Arm</label>
        <select class="form-select">
            <option>Select Arm</option>
            <option>Control</option>
            <option>Treatment A</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Subject Status</label>
        <select class="form-select">
            <option>SCREENED</option>
            <option>ENROLLED</option>
        </select>
    </div>
    <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="consentCheck">
        <label class="form-check-label" for="consentCheck">
            Informed Consent Provided
        </label>
    </div>
    <div class="mt-3">
        <button type="button">Screen</button>
        <button type="button">Enroll</button>
        <button type="button">Consent</button>
        <button type="button">Withdraw</button>
    </div>
    <table>
        <tr>
            <th>Subject ID</th>
            <th>Protocol ID</th>
            <th>Site ID</th>
            <th>Enrollment Date</th>
            <th>Study Arm</th>
            <th>Status</th>
        </tr>
    </table>
</form>
</div>
</body>
</html>
