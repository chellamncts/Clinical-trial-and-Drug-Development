<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sample Log Form</title>
</head>
<body>
<h2>Add Sample</h2>
<form th:action="@{/saveUser}" th:object="${user}" method="post">
    Subject ID: <input type="number" th:field="*{subjectId}" /><br><br>
    Sample Type: <input type="text" th:field="*{sampleType}" /><br><br>
    Collection Date: <input type="date" th:field="*{collectionDate}" /><br><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
