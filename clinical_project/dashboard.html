<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
<h2>Dashboard</h2>
<div id='sampleSection'>Sample Module</div>
<div id='drugSection'>Drug Module</div>
<div id='resultSection'>Result Module</div>
<script>
let role=localStorage.getItem('role');
if(role==='INVESTIGATOR') document.getElementById('resultSection').style.display='none';
if(role==='LAB') document.getElementById('drugSection').style.display='none';
if(role==='SAFETY'){
document.getElementById('sampleSection').style.display='none';
document.getElementById('drugSection').style.display='none';
document.getElementById('resultSection').style.display='none';}
</script>
</body>
</html>
