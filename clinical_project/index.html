<!DOCTYPE html>
<html>
<head><title>Home</title></head>
<body style='text-align:center;margin-top:100px;'>
<h2>Select Role</h2>
<select id='role'>
<option value='ADMIN'>Admin</option>
<option value='INVESTIGATOR'>Investigator</option>
<option value='LAB'>Lab</option>
<option value='SAFETY'>Safety</option>
</select><br><br>
<button onclick='goToRegister()'>Continue</button>
<script>
function goToRegister(){
let role=document.getElementById('role').value;
localStorage.setItem('role',role);
if(role==='ADMIN') window.location='register-admin.html';
else if(role==='INVESTIGATOR') window.location='register-investigator.html';
else if(role==='LAB') window.location='register-lab.html';
else window.location='register-safety.html';
}
</script>
</body>
</html>
