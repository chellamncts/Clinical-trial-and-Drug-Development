<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Enrollment - Clinical Trial</title>
    <link rel="stylesheet" href="/css/enrollment.css">
</head>
<body>

<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a href="/crcDashboard.html">Dashboard</a></li>
        <li><a class="active" href="/enrollment.html">Subject Enrollment</a></li>
        <li><a href="/visitScheduling.html">Visit Scheduling</a></li>
        <li><a href="/crfPage.html">CRFs</a></li>
        <li><a href="/queriesPage.html">Queries</a></li>
        <li><a href="/login.html">Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <nav class="navbar">
        <div class="brand"><span class="dot"></span> Clinical Trial &amp; Drug Development Tracking</div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title">Subject Enrollment &amp; Consent Management</div>
            <div class="card-body">
                <div class="status-message" id="statusMessage" style="display:none;">
                    <p id="statusText" style="color: #d32f2f; font-weight: 600; background:#fff3f3; padding:8px; border-left: 4px solid #d32f2f;"></p>
                </div>
                <form id="enrollForm">
                    <div class="grid">
                        <div class="field">
                            <label for="protocolId">Protocol ID <span class="required">*</span></label>
                            <input id="protocolId" type="number" min="1" placeholder="Enter Protocol ID" required>
                        </div>
                        <div class="field">
                            <label for="siteId">Site ID <span class="required">*</span></label>
                            <input id="siteId" type="number" min="1" placeholder="Enter Site ID" required>
                        </div>
                        <div class="field">
                            <label for="enrollmentDate">Enrollment Date <span class="required">*</span></label>
                            <input id="enrollmentDate" type="date" required>
                        </div>
                        <div class="field">
                            <label for="studyArm">Study Arm <span class="required">*</span></label>
                            <select id="studyArm" required>
                                <option value="">Select Arm</option>
                                <option value="Control">Control</option>
                                <option value="Treatment A">Treatment A</option>
                            </select>
                        </div>
                    </div>

                    <div class="field checkbox-row" style="margin: 16px 0; padding: 14px; background: #eef6ff; border-left: 4px solid #2563eb; border-radius: 4px;">
                        <input id="consentCheck" type="checkbox" required>
                        <label for="consentCheck" style="font-weight: 600; color: #1e3a8a;">
                            I, the subject, have read and understood the study information and I voluntarily consent to participate in this clinical trial.
                            <span class="required" style="color:red;">*</span>
                        </label>
                    </div>

                    <div class="actions">
                        <button class="btn" type="submit">Submit</button>
                        <a href="/enrollmentStatus.html" class="btn btn-outline">View Status</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">&copy; 2026 Clinical Trial &amp; Drug Development Tracking System</footer>
</div>

<script>
    document.getElementById("enrollmentDate").value = new Date().toISOString().split("T")[0];

    document.getElementById("enrollForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const statusBox = document.getElementById("statusMessage");
        const statusText = document.getElementById("statusText");
        statusBox.style.display = "none";

        const payload = {
            protocolId: parseInt(document.getElementById("protocolId").value, 10),
            siteId: parseInt(document.getElementById("siteId").value, 10),
            enrollmentDate: document.getElementById("enrollmentDate").value,
            studyArm: document.getElementById("studyArm").value,
            consentProvided: document.getElementById("consentCheck").checked
        };

        try {
            const res = await fetch("/api/subjects/screen", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                // Subject screened successfully -> go to the status page
                window.location.href = "/enrollmentStatus.html";
            } else {
                const err = await res.json().catch(() => ({}));
                statusText.textContent = err.message || "Failed to screen subject.";
                statusBox.style.display = "block";
            }
        } catch (ex) {
            statusText.textContent = "Network error: " + ex.message;
            statusBox.style.display = "block";
        }
    });
</script>

</body>
</html>
