<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRC Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/crcDashboard.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a class="active" href="/crcDashboard.html">Dashboard</a></li>
        <li><a href="/enrollment.html">Subject Enrollment</a></li>
        <li><a href="/visitScheduling.html">Visit Scheduling</a></li>
        <li><a href="/crfPage.html">CRFs</a></li>
        <li><a href="/queriesPage.html">Queries</a></li>
        <li><a href="/login.html">Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="row mb-4">
        <div class="col-md-2"><div class="summary-box"><h6>Scheduled Visits</h6><h3 id="scheduledVisits">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Pending CRFs</h6><h3 id="pendingCrfs">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Completed CRFs</h6><h3 id="completedCrfs">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Locked CRFs</h6><h3 id="lockedCrfs">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Open Queries</h6><h3 id="openQueries">0</h3></div></div>
        <div class="col-md-2"><div class="summary-box"><h6>Enrolled Subjects</h6><h3 id="enrolledSubjects">0</h3></div></div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4"><div class="card p-3"><h6>CRF Status Distribution</h6><canvas id="crfStatusChart"></canvas></div></div>
        <div class="col-md-4"><div class="card p-3"><h6>Visits Timeline</h6><canvas id="visitsChart"></canvas></div></div>
        <div class="col-md-4"><div class="card p-3"><h6>Subject Enrollment Trends</h6><canvas id="subjectChart"></canvas></div></div>
    </div>
</div>

<script>
    async function loadDashboard() {
        const res = await fetch("/api/dashboard");
        const d = await res.json();

        // Summary boxes
        document.getElementById("scheduledVisits").textContent = d.scheduledVisits;
        document.getElementById("pendingCrfs").textContent = d.pendingCrfs;
        document.getElementById("completedCrfs").textContent = d.completedCrfs;
        document.getElementById("lockedCrfs").textContent = d.lockedCrfs;
        document.getElementById("openQueries").textContent = d.openQueries;
        document.getElementById("enrolledSubjects").textContent = d.enrolledSubjects;

        // CRF Status Pie Chart
        new Chart(document.getElementById('crfStatusChart'), {
            type: 'pie',
            data: {
                labels: ['Pending', 'Completed', 'Locked'],
                datasets: [{
                    data: [d.pendingCrfs, d.completedCrfs, d.lockedCrfs],
                    backgroundColor: ['#ffcc00', '#1D9E75', '#185FA5']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Visits Timeline Line Chart
        new Chart(document.getElementById('visitsChart'), {
            type: 'line',
            data: {
                labels: d.visitsTimelineLabels || [],
                datasets: [{
                    label: 'Visits',
                    data: d.visitsTimelineData || [],
                    borderColor: '#378ADD',
                    fill: false,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } }
            }
        });

        // Subject Enrollment Bar Chart  [screened, enrolled, withdrawn]
        new Chart(document.getElementById('subjectChart'), {
            type: 'bar',
            data: {
                labels: ['Screened', 'Enrolled', 'Withdrawn'],
                datasets: [{
                    label: 'Subjects',
                    data: d.subjectEnrollmentData || [],
                    backgroundColor: ['#ffcc00', '#1D9E75', '#d9534f']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } }
            }
        });
    }

    loadDashboard().catch(err => console.error("Failed to load dashboard", err));
</script>

</body>
</html>
