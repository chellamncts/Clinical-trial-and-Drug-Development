<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Enrollment & Consent Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="enrolment.css">
</head>

<body>

<div class="container">

<h2>Subject Enrollment & Consent Management</h2>

<form>

    <div class="form-group">
        <label class="form-label">Subject ID <span style="color:red">*</span></label>
        <input type="text" class="form-control" placeholder="Enter Subject ID" required>
    </div>

    <div class="form-group">
        <label class="form-label">Protocol ID <span style="color:red">*</span></label>
        <input type="text" class="form-control" placeholder="Enter Protocol ID" required>
    </div>

    <div class="form-group">
        <label class="form-label">Site ID <span style="color:red">*</span></label>
        <input type="text" class="form-control" placeholder="Enter Site ID" required>
    </div>

    <div class="form-group">
        <label class="form-label">Enrollment Date <span style="color:red">*</span></label>
        <input type="date" class="form-control" required>
    </div>

    <div class="form-group">
        <label class="form-label">Study Arm <span style="color:red">*</span></label>
        <select class="form-select" required>
            <option>Select Arm</option>
            <option>Control</option>
            <option>Treatment A</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Subject Status <span style="color:red">*</span></label>
        <select class="form-select" required>
            <option>SCREENED</option>
            <option>ENROLLED</option>
        </select>
    </div>

    <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="consentCheck">
        <label class="form-check-label" for="consentCheck">
            Informed Consent Provided <span style="color:red">*</span>
        </label>
    </div>

    <div class="mt-3">
        <button type="button">Screen</button>
        <button type="button" id="enrollBtn">Enroll</button>
        <button type="button">Consent</button>
        <button type="button">Withdraw</button>
    </div>
</form>

</div>

<script src="enrolment.js"></script>

</body>
</html>
