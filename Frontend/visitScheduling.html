<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Scheduling - Clinical Trial</title>
    <link rel="stylesheet" href="/css/visitScheduling.css">
</head>
<body>

<div class="sidebar">
    <h3 class="sidebar-title">CRC Dashboard</h3>
    <ul class="sidebar-links">
        <li><a href="/crcDashboard.html">Dashboard</a></li>
        <li><a href="/enrollment.html">Subject Enrollment</a></li>
        <li><a class="active" href="/visitScheduling.html">Visit Scheduling</a></li>
        <li><a href="/crfPage.html">CRFs</a></li>
        <li><a href="/queriesPage.html">Queries</a></li>
        <li><a href="/login.html">Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <nav class="navbar">
        <div class="brand"><span class="dot"></span> Clinical Trial & Drug Development Tracking</div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-title">Schedule New Visit</div>
            <div class="card-body">
                <form id="scheduleForm">
                    <div class="grid">
                            <div class="field">
                                <label for="subjectId">Subject ID <span class="text-danger">*</span></label>
                                <input id="subjectId" type="number" min="1" required>
                            </div>
                            <div class="field">
                                <label for="visitName">Visit Name <span class="text-danger">*</span></label>
                                <input id="visitName" type="text" required>
                            </div>
                            <div class="field">
                                <label for="visitDate">Visit Date <span class="text-danger">*</span></label>
                                <input id="visitDate" type="date" required>
                            </div>
                        </div>

                        <div class="actions">
                        <button class="btn" type="submit">Schedule Visit</button>
                        <a class="btn btn-outline" href="/crfPage.html">Show All</a>
                    </div>
                </form>

                <p id="scheduleMsg" style="margin-top:10px;"></p>
            </div>
        </div>
    </div>

    <footer class="footer">&copy; 2026 Clinical Trial & Drug Development Tracking System</footer>
</div>

<script>
    // Set min date to today
    document.getElementById("visitDate").min = new Date().toISOString().split("T")[0];

    document.getElementById("scheduleForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const payload = {
            visitName: document.getElementById("visitName").value,
            visitDate: document.getElementById("visitDate").value,
            trialSubject: {
                subjectId: parseInt(document.getElementById("subjectId").value, 10)
            }
        };

        const msg = document.getElementById("scheduleMsg");

        try {
            const res = await fetch("/api/visits/schedule", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                msg.style.color = "green";
                msg.textContent = "Visit scheduled successfully.";
                this.reset();
                document.getElementById("visitDate").min = new Date().toISOString().split("T")[0];
            } else {
                const err = await res.text();
                msg.style.color = "red";
                msg.textContent = "Failed to schedule visit: " + err;
            }
        } catch (ex) {
            msg.style.color = "red";
            msg.textContent = "Network error: " + ex.message;
        }
    });
</script>

</body>
</html>
